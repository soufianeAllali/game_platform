<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Neon Tap Rhythm Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            color: #fff;
            overflow: hidden;
            padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
            touch-action: none;
        }

        .home-btn {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            z-index: 30;
            min-height: 42px;
            padding: 9px 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(5, 5, 13, 0.84);
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(1.45rem, 6vw, 2.3rem);
            margin-bottom: 10px;
            color: #bd00ff;
            text-align: center;
            text-shadow: 0 0 15px rgba(189, 0, 255, 0.6);
        }

        .stats-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            margin-bottom: 14px;
            background: #0d0d21;
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid #1f1f45;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .stat-box span {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 4vw, 20px);
            width: min(395px, calc(100vw - 28px), calc(100dvh - 185px));
            min-width: 260px;
            background: #090914;
            padding: clamp(14px, 5vw, 25px);
            border-radius: 20px;
            border: 2px solid #1a1a3a;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 0;
            position: relative;
        }

        .pad {
            aspect-ratio: 1;
            min-width: 0;
            background-color: #121225;
            border: 2px solid #222244;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .pad:active {
            transform: scale(0.92);
        }

        .pad.active-pink {
            background-color: #ff007f;
            border-color: #ff66b2;
            box-shadow: 0 0 30px #ff007f, inset 0 0 15px #ffffff;
        }

        .pad.active-cyan {
            background-color: #00f2fe;
            border-color: #7bfaff;
            box-shadow: 0 0 30px #00f2fe, inset 0 0 15px #ffffff;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 13, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            z-index: 10;
            padding: 18px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .overlay h2 {
            font-size: clamp(1.35rem, 6vw, 2.2rem);
            color: #00ffcc;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #bd00ff 0%, #bd00ff 100%);
            border: none;
            color: white;
            min-height: 46px;
            padding: 12px 35px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(189, 0, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(189, 0, 255, 0.6);
        }

        .instructions {
            margin-top: 15px;
            font-size: clamp(0.76rem, 2.7vw, 0.85rem);
            color: #9393bc;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 620px) {
            body { justify-content: flex-start; }
            h1 { margin-top: 34px; }
        }

        @media (max-height: 600px) {
            h1 { display: none; }
            .grid { width: min(360px, calc(100vw - 28px), calc(100dvh - 112px)); }
        }
    </style>
</head>
<body>
    <a class="home-btn" href="../index.html">Home</a>

    <h1>Fast Neon Rhythm</h1>

    <div class="stats-container">
        <div class="stat-box">Score: <span id="score">0</span></div>
        <div class="stat-box">Lives: <span id="lives">&hearts;&hearts;&hearts;</span></div>
    </div>

    <div class="grid" id="gameGrid">
        <div class="pad" data-index="0"></div>
        <div class="pad" data-index="1"></div>
        <div class="pad" data-index="2"></div>
        <div class="pad" data-index="3"></div>
        <div class="pad" data-index="4"></div>
        <div class="pad" data-index="5"></div>
        <div class="pad" data-index="6"></div>
        <div class="pad" data-index="7"></div>
        <div class="pad" data-index="8"></div>

        <div id="overlay" class="overlay">
            <h2 id="overlay-text">Tap speed challenge!</h2>
            <button id="start-btn" class="btn">Start Game</button>
            <p class="instructions">Tap the glowing circles as soon as they appear.<br>Avoid dark circles and do not wait too long.</p>
        </div>
    </div>

    <script>
        const pads = document.querySelectorAll('.pad');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlay-text');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let lives = 3;
        let currentActivePad = null;
        let gameTimeout = null;
        let isGameRunning = false;
        let duration = 1000;
        const themes = ['active-pink', 'active-cyan'];

        pads.forEach(pad => pad.addEventListener('pointerdown', handlePadClick));

        function startGame() {
            score = 0;
            lives = 3;
            duration = 1000;
            scoreEl.textContent = score;
            livesEl.textContent = "\u2665\u2665\u2665";
            isGameRunning = true;
            overlay.classList.add('hidden');
            nextTick();
        }

        function nextTick() {
            if (!isGameRunning) return;
            resetPads();

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * pads.length);
            } while (pads[randomIndex] === currentActivePad);

            currentActivePad = pads[randomIndex];
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            currentActivePad.classList.add(randomTheme);

            gameTimeout = setTimeout(() => {
                handleMiss();
            }, duration);
        }

        function handlePadClick(e) {
            e.preventDefault();
            if (!isGameRunning) return;

            const clickedPad = e.currentTarget;
            if (clickedPad === currentActivePad) {
                clearTimeout(gameTimeout);
                score += 10;
                scoreEl.textContent = score;

                if (duration > 400) {
                    duration -= 25;
                } else if (duration > 250) {
                    duration -= 10;
                }

                nextTick();
            } else {
                clearTimeout(gameTimeout);
                reduceLife();
            }
        }

        function handleMiss() {
            reduceLife();
        }

        function reduceLife() {
            lives--;
            livesEl.textContent = "\u2665".repeat(lives) || "0";

            if (lives <= 0) {
                endGame();
            } else {
                nextTick();
            }
        }

        function resetPads() {
            pads.forEach(pad => {
                pad.classList.remove('active-pink', 'active-cyan');
            });
        }

        function endGame() {
            isGameRunning = false;
            clearTimeout(gameTimeout);
            resetPads();
            overlayText.textContent = "Game over!";
            startBtn.textContent = `Play Again (Score: ${score})`;
            overlay.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
