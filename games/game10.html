<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Guess Adventure</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Comic Sans MS, cursive;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GAME BOX */

.game{
    width:95%;
    max-width:500px;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
    text-align:center;
}

/* TITLE */

h1{
    font-size:40px;
    color:#ff4d6d;
}

/* SCORE + TIMER */

.top{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.box{
    background:#fff0f3;
    padding:10px 15px;
    border-radius:15px;
    font-size:18px;
}

/* WORD */

.word{
    margin-top:30px;
    font-size:40px;
    letter-spacing:10px;
    color:#333;
}

/* INPUT */

input{
    width:90%;
    padding:15px;
    font-size:20px;
    border-radius:15px;
    border:2px solid #ff4d6d;
    margin-top:20px;
    outline:none;
    text-align:center;
}

/* BUTTONS */

button{
    margin-top:15px;
    padding:15px 20px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.check{
    background:#4caf50;
    color:white;
}

.hint{
    background:#2196f3;
    color:white;
}

.restart{
    background:#ff4d6d;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

/* MESSAGE */

.message{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    height:30px;
}

/* ANIMATION */

.pop{
    animation:pop 0.3s ease;
}

@keyframes pop{
    0%{transform:scale(0.8);}
    100%{transform:scale(1);}
}

</style>
<style>
.hub-home-link{position:fixed;top:14px;left:14px;z-index:5000;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;color:#16213f;background:rgba(255,255,255,.86);box-shadow:0 12px 28px rgba(20,30,60,.18);font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;font-size:14px;font-weight:900;text-decoration:none;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease}.hub-home-link:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(20,30,60,.25)}
html,body{max-width:100%;overflow-x:hidden;touch-action:manipulation}body{padding:70px 12px 20px}.game{width:min(500px,100%);padding:clamp(18px,4vw,30px)}.game h1{font-size:clamp(26px,7vw,40px);line-height:1.1}.box{font-size:clamp(14px,4vw,18px)}.word{font-size:clamp(28px,8vw,40px);letter-spacing:clamp(4px,1.8vw,10px);overflow-wrap:anywhere}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{min-height:52px;font-size:clamp(16px,4vw,20px)}.message{font-size:clamp(18px,5vw,24px)}@media(max-width:560px){.hub-home-link{top:10px;left:10px;min-height:40px;padding:8px 12px}}
</style>
</head>

<body>
<a class="hub-home-link" href="../index.html">🏠 Home</a>

<div class="game">

    <h1>🎮 Word Adventure</h1>

    <div class="top">
        <div class="box">⭐ Score: <span id="score">0</span></div>
        <div class="box">⏳ Time: <span id="time">20</span></div>
    </div>

    <div class="word" id="word">_ _ _ _</div>

    <input type="text" id="input" placeholder="Type the word...">

    <br>

    <button class="check" onclick="checkWord()">Check</button>
    <button class="hint" onclick="showHint()">Hint</button>
    <button class="restart" onclick="restartGame()">Restart</button>

    <div class="message" id="message"></div>

</div>

<script>

/* WORD LIST */

const words = [
    "cat","dog","sun","book","tree",
    "fish","milk","apple","bird","car",
    "home","star","cake","rain","ball"
];

let currentWord = "";
let score = 0;
let time = 20;
let hintUsed = false;

/* ELEMENTS */

const wordEl = document.getElementById("word");
const input = document.getElementById("input");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const message = document.getElementById("message");

/* RANDOM WORD */

function newWord(){

    currentWord = words[Math.floor(Math.random()*words.length)];

    let hidden = "";

    for(let i=0;i<currentWord.length;i++){
        hidden += "_ ";
    }

    wordEl.innerText = hidden;
    input.value = "";
    hintUsed = false;
}

/* CHECK WORD */

function checkWord(){

    let user = input.value.toLowerCase();

    if(user === currentWord){

        score++;
        scoreEl.innerText = score;

        message.innerText = "🎉 Great Job!";
        message.style.color = "green";

        successSound();

        wordEl.classList.add("pop");

        setTimeout(()=>{
            wordEl.classList.remove("pop");
        },300);

        newWord();

    } else {

        message.innerText = "❌ Try Again!";
        message.style.color = "red";

        failSound();
    }
}

/* HINT */

function showHint(){

    if(!hintUsed){

        message.innerText =
        "💡 First letter is: " + currentWord[0];

        hintUsed = true;

    }
}

/* TIMER */

function startTimer(){

    setInterval(()=>{

        time--;

        timeEl.innerText = time;

        if(time <= 0){

            message.innerText =
            "⏰ Time's up! Restart";

            failSound();

            time = 0;

        }

    },1000);

}

/* RESTART */

function restartGame(){

    score = 0;
    time = 20;

    scoreEl.innerText = score;
    timeEl.innerText = time;

    message.innerText = "";

    newWord();

}

/* SOUNDS */

function successSound(){

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
    );

    audio.volume = 0.3;
    audio.play();
}

function failSound(){

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"
    );

    audio.volume = 0.2;
    audio.play();
}

/* START GAME */

newWord();
startTimer();

</script>

</body>
</html>
