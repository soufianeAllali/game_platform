<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crazy Dentiste Deluxe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="screen start-screen active" id="startScreen">
      <div class="logo-badge">🦷</div>
      <h1>Crazy Dentiste Deluxe</h1>
      <p>Fix funny smiles, unlock wild tools, and beat boss patients.</p>
      <div class="save-card">
        <span>Best stars</span>
        <strong id="bestStars">0</strong>
      </div>
      <button class="primary-btn" id="startBtn">Start Clinic</button>
      <button class="ghost-btn" id="resetBtn">Reset Progress</button>
    </section>

    <section class="screen game-screen" id="gameScreen">
      <header class="top-hud">
        <a class="home-link" href="../game15.html" aria-label="Back">‹</a>
        <div class="hud-pill">Level <strong id="levelText">1</strong></div>
        <div class="hud-pill coins">🪙 <strong id="coinsText">0</strong></div>
        <div class="hud-pill combo">Combo <strong id="comboText">0</strong>x</div>
        <div class="timer-wrap"><span id="timerText">70</span><i id="timerBar"></i></div>
      </header>

      <div class="clinic" id="clinic">
        <aside class="tools-panel">
          <div class="panel-title">Tools</div>
          <div class="tool-grid" id="toolGrid"></div>
        </aside>

        <section class="patient-stage" id="patientStage">
          <div class="background-items" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="patient-card boss-off" id="patientCard">
            <div class="speech" id="speech">Tap a tool, then heal the teeth!</div>
            <div class="patient" id="patient">
              <div class="head">
                <div class="antenna"></div>
                <div class="eye left"><b></b></div>
                <div class="eye right"><b></b></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
                <div class="mouth">
                  <div class="tongue"></div>
                  <div class="teeth" id="teeth"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="progress-shell"><i id="progressBar"></i></div>
        </section>
      </div>
    </section>

    <section class="screen result-screen" id="resultScreen">
      <div class="result-icon" id="resultIcon">⭐</div>
      <h2 id="resultTitle">Smile saved!</h2>
      <div class="stars" id="starsBox"></div>
      <p id="resultText">Rewards earned.</p>
      <div class="result-actions">
        <button class="primary-btn" id="nextBtn">Next Patient</button>
        <button class="ghost-btn" id="retryBtn">Retry</button>
      </div>
    </section>
  </main>
  <div class="fx-layer" id="fxLayer"></div>
  <script src="script.js"></script>
</body>
</html>
