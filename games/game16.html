<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rainbow Orchestra</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;color:#17314d;background:linear-gradient(135deg,#ffdf6e,#ff70ac 38%,#48d8ff 70%,#6cf09a)}button{font:inherit;border:0;cursor:pointer}.wrap{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:14px}.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{min-height:42px;padding:9px 14px;border-radius:16px;background:rgba(255,255,255,.84);font-weight:1000;box-shadow:0 10px 24px rgba(20,40,70,.13)}.stage{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.18));box-shadow:inset 0 0 0 3px rgba(255,255,255,.45)}.title{position:absolute;z-index:2;left:50%;top:14px;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 5px 0 rgba(30,30,70,.18)}.title h1{margin:0;font-size:clamp(2rem,7vw,4.8rem);line-height:.9}.title p{margin:6px 0 0;font-weight:1000}.lanes{position:absolute;inset:105px 14px 94px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.lane{position:relative;overflow:hidden;border-radius:24px;background:rgba(255,255,255,.32);box-shadow:inset 0 0 0 3px rgba(255,255,255,.42)}.lane::after{content:"";position:absolute;left:12%;right:12%;bottom:18px;height:10px;border-radius:999px;background:#fff;box-shadow:0 0 26px #fff}.note{position:absolute;left:50%;top:-70px;width:min(78px,18vw);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:2.1rem;font-weight:1000;transform:translateX(-50%);box-shadow:0 12px 0 rgba(31,36,83,.18),0 18px 35px rgba(31,36,83,.22);animation:fall var(--speed) linear forwards}.note.good{animation:pop .28s ease forwards}.note.miss{animation:miss .35s ease forwards}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pad{min-height:72px;border-radius:22px;color:#fff;font-size:2rem;font-weight:1000;box-shadow:0 10px 0 rgba(28,40,70,.18)}.pad:active{transform:translateY(5px)}.c0{background:linear-gradient(135deg,#ff4f8f,#ffb347)}.c1{background:linear-gradient(135deg,#28c7ff,#7464ff)}.c2{background:linear-gradient(135deg,#38df8f,#00b894)}.c3{background:linear-gradient(135deg,#ffd247,#ff7a59)}.screen{position:absolute;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(135deg,rgba(255,112,172,.95),rgba(72,216,255,.95))}.screen.hidden{display:none}.card h2{margin:0;color:#fff;font-size:clamp(2.8rem,10vw,6rem);text-shadow:0 6px 0 rgba(20,40,70,.18)}.card p{font-weight:1000}.play{min-width:220px;min-height:56px;border-radius:20px;background:#fff;color:#17314d;font-weight:1000}.spark{position:absolute;width:12px;aspect-ratio:1;border-radius:50%;background:var(--c);animation:burst .65s ease-out forwards}@keyframes fall{to{top:calc(100% - 78px)}}@keyframes pop{to{transform:translateX(-50%) scale(1.5);opacity:0}}@keyframes miss{to{transform:translateX(-50%) rotate(24deg);opacity:.25}}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(max-width:600px){.lanes{inset:120px 8px 88px;gap:6px}.pad{min-height:62px;border-radius:17px}.pill{font-size:.9rem;padding:8px 10px}.note{border-radius:18px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="hud"><div class="pill">Level <b id="level">1</b></div><div class="pill">Score <b id="score">0</b></div><div class="pill">Combo <b id="combo">0</b>x</div><div class="pill">Coins <b id="coins">0</b></div></div>
  <section class="stage" id="stage">
    <div class="title"><h1>Rainbow Orchestra</h1><p>Tap the beat gems on the white line</p></div>
    <div class="lanes" id="lanes"></div>
    <div class="screen" id="screen"><div class="card"><h2>Rainbow Orchestra</h2><p>Make music, earn stars, unlock faster songs.</p><button class="play" id="start">Play Song</button></div></div>
  </section>
  <div class="controls" id="controls"></div>
</main>
<script>
const lanes=document.querySelector("#lanes"),controls=document.querySelector("#controls"),stage=document.querySelector("#stage"),screen=document.querySelector("#screen");
const ui={level:level,score:score,combo:combo,coins:coins};
let audio,levelNo=1,scoreNo=0,comboNo=0,coinsNo=0,notes=[],running=false,spawnTimer,roundTimer;
const icons=["♪","♫","★","●"],colors=["#ff4f8f","#28c7ff","#38df8f","#ffd247"];
for(let i=0;i<4;i++){const lane=document.createElement("div");lane.className="lane";lanes.appendChild(lane);const b=document.createElement("button");b.className=`pad c${i}`;b.textContent=icons[i];b.onclick=()=>hit(i);controls.appendChild(b)}
function ac(){if(!audio)audio=new(AudioContext||webkitAudioContext)();if(audio.state==="suspended")audio.resume()}
function beep(f=440,d=.08){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function startGame(){ac();screen.classList.add("hidden");running=true;scoreNo=0;comboNo=0;notes=[];ui.score.textContent=0;ui.combo.textContent=0;spawnTimer=setInterval(spawn,Math.max(430,900-levelNo*55));roundTimer=setTimeout(endRound,26000+levelNo*1600)}
function spawn(){const lane=Math.floor(Math.random()*4),el=document.createElement("div");el.className="note";el.textContent=icons[lane];el.style.background=colors[lane];el.style.setProperty("--speed",`${Math.max(1.15,2.8-levelNo*.13)}s`);lanes.children[lane].appendChild(el);const n={lane,el,hit:false};notes.push(n);el.addEventListener("animationend",()=>{if(!n.hit){comboNo=0;ui.combo.textContent=0;el.classList.add("miss");setTimeout(()=>el.remove(),300)}})}
function hit(lane){if(!running)return;const laneEl=lanes.children[lane];let best=null,dist=999;notes.forEach(n=>{if(n.lane!==lane||n.hit)return;const y=n.el.offsetTop+n.el.offsetHeight,goal=laneEl.clientHeight-18,delta=Math.abs(goal-y);if(delta<dist){dist=delta;best=n}});if(best&&dist<95){best.hit=true;best.el.classList.add("good");comboNo++;scoreNo+=10+comboNo;coinsNo+=2;ui.score.textContent=scoreNo;ui.combo.textContent=comboNo;ui.coins.textContent=coinsNo;beep(440+lane*140);burst(laneEl.getBoundingClientRect().left+laneEl.clientWidth/2,laneEl.getBoundingClientRect().bottom-70);setTimeout(()=>best.el.remove(),240)}else{comboNo=0;ui.combo.textContent=0;stage.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:220});beep(120,.13)}}
function burst(x,y){for(let i=0;i<16;i++){const s=document.createElement("i");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--c",colors[i%4]);s.style.setProperty("--x",(Math.random()-.5)*180+"px");s.style.setProperty("--y",(Math.random()-.5)*150+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}
function endRound(){running=false;clearInterval(spawnTimer);clearTimeout(roundTimer);document.querySelectorAll(".note").forEach(n=>n.remove());if(scoreNo>260+levelNo*60){levelNo++;ui.level.textContent=levelNo;screen.querySelector("h2").textContent="Song Cleared!";screen.querySelector("p").textContent="Reward earned. Next level is faster."}else{screen.querySelector("h2").textContent="Try Again";screen.querySelector("p").textContent="Catch more notes near the white line."}screen.classList.remove("hidden")}
document.querySelector("#start").onclick=startGame;document.addEventListener("keydown",e=>{const k=["1","2","3","4"].indexOf(e.key);if(k>-1)hit(k)});
</script>
</body>
</html>
