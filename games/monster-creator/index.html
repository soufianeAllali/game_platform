<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Monster Creator Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <canvas id="fx"></canvas>

    <header class="topbar">
      <a class="home" href="../../index.html" aria-label="Home">‹</a>
      <div class="stat"><span>Coins</span><strong id="coinsText">0</strong></div>
      <div class="stat"><span>XP</span><strong id="xpText">0</strong></div>
      <div class="stat"><span>Level</span><strong id="levelText">1</strong></div>
      <button class="icon-btn" id="photoBtn" title="Photo mode">📸</button>
      <button class="icon-btn" id="galleryBtn" title="Gallery">🖼️</button>
    </header>

    <section class="screen loading active" id="loadingScreen">
      <div class="spinner">👾</div>
      <h1>Monster Creator Studio</h1>
      <p>Preparing funny monster parts...</p>
    </section>

    <section class="studio" id="studio">
      <aside class="panel left-panel">
        <div class="panel-head">
          <h2>Parts</h2>
          <button id="challengeBtn">Challenge</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="parts-grid" id="partsGrid"></div>
      </aside>

      <section class="stage-wrap">
        <div class="room-switcher" id="roomSwitcher"></div>
        <div class="stage" id="stage">
          <div class="target-card" id="targetCard"></div>
          <div class="monster" id="monster">
            <div class="body-core" id="bodyCore"></div>
          </div>
        </div>
        <div class="actions">
          <button id="undoBtn">↶</button>
          <button id="redoBtn">↷</button>
          <button id="randomBtn">🎲 Random</button>
          <button id="danceBtn">💃 Dance</button>
          <button id="laughBtn">😂 Laugh</button>
          <button id="sleepBtn">💤 Sleep</button>
          <button id="battleBtn">⚔️ Battle</button>
          <button class="primary" id="saveBtn">Save Monster</button>
        </div>
      </section>

      <aside class="panel right-panel">
        <div class="panel-head">
          <h2>Customize</h2>
          <button id="shopBtn">Shop</button>
        </div>
        <label>Color <input type="color" id="colorInput" value="#27dcff"></label>
        <label>Size <input type="range" id="sizeInput" min="50" max="170" value="100"></label>
        <label>Rotate <input type="range" id="rotateInput" min="-180" max="180" value="0"></label>
        <div class="layer-tools">
          <button id="frontBtn">Layer +</button>
          <button id="backBtn">Layer -</button>
          <button id="flipBtn">Flip</button>
          <button id="deleteBtn">Delete</button>
        </div>
        <div class="challenge-info" id="challengeInfo">Create any silly monster you like.</div>
      </aside>
    </section>

    <section class="modal" id="shopModal">
      <div class="modal-card">
        <div class="modal-head"><h2>Unlock Parts</h2><button data-close>×</button></div>
        <div class="shop-grid" id="shopGrid"></div>
      </div>
    </section>

    <section class="modal" id="galleryModal">
      <div class="modal-card">
        <div class="modal-head"><h2>Monster Gallery</h2><button data-close>×</button></div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </section>

    <section class="modal" id="resultModal">
      <div class="modal-card result">
        <div class="result-icon" id="resultIcon">⭐</div>
        <h2 id="resultTitle">Monster Saved!</h2>
        <div class="stars" id="starsBox"></div>
        <p id="resultText">Rewards earned.</p>
        <button class="primary" data-close>Continue</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
