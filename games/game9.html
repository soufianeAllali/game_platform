<div class="title">🏙️ CRAZY TALKING TOY CITY 🏙️</div>

<div class="city"></div>

<button onclick="spawnCharacters()">Spawn More Characters</button>

<script>

const city = document.querySelector(".city");

const emojis = ["🐱","🐶","🤖","👻","🦊","🐸"];

const texts = [
"Hello human 😄",
"I am super happy!",
"Catch me if you can!",
"I love this city 🏙️",
"BOO! 👻",
"I am dancing 💃",
"Do you like pizza? 🍕",
"I am lost 😂",
"This city is crazy!",
"I can talk now! 🎤"
];

const moods = ["happy", "angry", "crazy"];

/* CREATE CHARACTER */

function createCharacter(){

    const char = document.createElement("div");
    char.className = "character";

    char.innerHTML =
    emojis[Math.floor(Math.random()*emojis.length)];

    char.style.left =
    Math.random()*(window.innerWidth-120)+"px";

    char.style.top =
    Math.random()*(window.innerHeight-200)+"px";

    char.style.background =
    `hsl(${Math.random()*360},70%,60%)`;

    city.appendChild(char);

    const speech = document.createElement("div");
    speech.className = "speech";
    city.appendChild(speech);

    /* CHARACTER DATA */
    let mood = moods[Math.floor(Math.random()*moods.length)];
    let clicks = 0;

    /* FOLLOW SPEECH */
    function updateSpeech(){
        speech.style.left = (char.offsetLeft + 10) + "px";
        speech.style.top = (char.offsetTop - 40) + "px";
    }

    setInterval(updateSpeech,30);

    /* RANDOM MOVEMENT (depends on mood) */
    setInterval(()=>{

        let speed = 2000;

        if(mood === "crazy") speed = 1200;
        if(mood === "angry") speed = 2500;

        char.style.left =
        Math.random()*(window.innerWidth-120)+"px";

        char.style.top =
        Math.random()*(window.innerHeight-200)+"px";

    },2000);

    /* CLICK INTERACTION */

    char.onclick = ()=>{

        clicks++;

        let msg = texts[Math.floor(Math.random()*texts.length)];

        /* MOOD CHANGE SYSTEM */
        if(clicks > 6){
            mood = "angry";
            msg = "I AM REALLY ANGRY 😡";
        }
        else if(clicks > 3){
            mood = "crazy";
            msg = "STOP TOUCHING ME 😂";
        }

        speech.innerText = msg;
        speech.style.display = "block";

        playSound(msg);

        /* VISUAL REACTION */
        char.style.transform = "scale(1.4) rotate(5deg)";

        if(mood === "angry"){
            char.style.filter = "hue-rotate(180deg)";
        }

        setTimeout(()=>{
            speech.style.display = "none";
            char.style.transform = "scale(1)";
        },2000);

    };

}

/* SPAWN */

function spawnCharacters(){

    for(let i=0;i<5;i++){
        createCharacter();
    }

}

/* SOUND + VOICE */

function playSound(text){

    const audio =
    new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

    audio.volume = 0.3;
    audio.play();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

/* START */

for(let i=0;i<6;i++){
    createCharacter();
}

</script>

</body>
