.game{
    width:400px;

}

.line{
    position:absolute;
    width:10px;
    height:120px;
    background:white;
    left:195px;
    animation:road 1s linear infinite;
}

@keyframes road{

    from{
        top:-120px;
    }

    to{
        top:100vh;
    }

}

/* PLAYER CAR */

.car{
    position:absolute;
    width:80px;
    height:140px;
    background:red;
    bottom:30px;
    left:160px;
    border-radius:15px;
    box-shadow:0 0 20px red;
}

.car::before{
    content:"";
    position:absolute;
    width:50px;
    height:40px;
    background:#9be7ff;
    top:15px;
    left:15px;
    border-radius:10px;
}

.car::after{
    content:"";
    position:absolute;
    width:50px;
    height:40px;
    background:#9be7ff;
    bottom:15px;
    left:15px;
    border-radius:10px;
}

/* ENEMY */

.enemy{
    position:absolute;
    width:80px;
    height:140px;
    border-radius:15px;
}

/* SCORE */

.score{
    position:fixed;
    top:20px;
    left:20px;
    background:white;
    padding:15px 25px;
    border-radius:15px;
    font-size:30px;
    z-index:100;
}

/* GAME OVER */

.gameOver{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:200;
}

.gameOver h1{
    font-size:80px;
}

.gameOver button{
    margin-top:30px;
    padding:15px 40px;
    border:none;
    border-radius:15px;
    background:red;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.gameOver button:hover{
    transform:scale(1.1);
}

</style>

<div class="score">
    Score : <span id="score">0</span>
</div>

<div class="game" id="game">

    <!-- ROAD LINES -->

    <div class="line" style="top:-120px;"></div>
    <div class="line" style="top:120px;"></div>
    <div class="line" style="top:360px;"></div>
    <div class="line" style="top:600px;"></div>

    <!-- PLAYER -->

    <div class="car" id="car"></div>

</div>

<div class="gameOver" id="gameOver">

    <h1>💥 GAME OVER 💥</h1>

    <h2 id="finalScore"></h2>

    <button onclick="restartGame()">
        PLAY AGAIN
    </button>

</div>

<script>

/* ELEMENTS */

const car = document.getElementById("car");
const game = document.getElementById("game");

const scoreText =
document.getElementById("score");

const gameOver =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");

/* VARIABLES */

let carX = 160;

let score = 0;

let speed = 5;

let gameRunning = true;

const keys = {};

/* KEY EVENTS */

document.addEventListener("keydown",(e)=>{

    keys[e.key] = true;

});

document.addEventListener("keyup",(e)=>{

    keys[e.key] = false;

});

/* TOUCH CONTROLS */

function setCarFromTouch(e){

    if(!gameRunning) return;

    const touch = e.touches ? e.touches[0] : e;
    const gameRect = game.getBoundingClientRect();
    const maxX = game.offsetWidth - car.offsetWidth;
    const nextX = touch.clientX - gameRect.left - car.offsetWidth / 2;

    carX = Math.max(0,Math.min(nextX,maxX));
    car.style.left = carX + "px";
}

game.addEventListener("touchstart",(e)=>{

    e.preventDefault();
    setCarFromTouch(e);

},{passive:false});

game.addEventListener("touchmove",(e)=>{

    e.preventDefault();
    setCarFromTouch(e);

},{passive:false});

game.addEventListener("touchend",()=>{

    keys["ArrowLeft"] = false;
    keys["ArrowRight"] = false;

});

let mouseDriving = false;

game.addEventListener("mousedown",(e)=>{

    mouseDriving = true;
    setCarFromTouch(e);

});

document.addEventListener("mousemove",(e)=>{

    if(mouseDriving){
        setCarFromTouch(e);
    }

});

document.addEventListener("mouseup",()=>{

    mouseDriving = false;

});

/* PLAYER MOVE */

function moveCar(){

    if(keys["ArrowLeft"] && carX > 0){

        carX -= 7;

    }

    if(keys["ArrowRight"] && carX < 320){

        carX += 7;

    }

    car.style.left = carX + "px";

}

/* CREATE ENEMY */

function createEnemy(){

    if(!gameRunning) return;

    const enemy =
    document.createElement("div");

    enemy.classList.add("enemy");

    enemy.style.background =
    randomColor();

    enemy.style.left =
    Math.floor(Math.random()*4)*80+"px";

    enemy.style.top = "-160px";

    game.appendChild(enemy);

    moveEnemy(enemy);

}

/* RANDOM COLOR */

function randomColor(){

    const colors = [
        "#00e5ff",
        "#ffea00",
        "#00ff95",
        "#ff00d4",
        "#ff8800"
    ];

    return colors[
        Math.floor(Math.random()*colors.length)
    ];

}

/* MOVE ENEMY */

function moveEnemy(enemy){

    let enemyY = -160;

    const interval = setInterval(()=>{

        if(!gameRunning){

            clearInterval(interval);

            return;

        }

        enemyY += speed;

        enemy.style.top = enemyY + "px";

        /* COLLISION */

        const enemyRect =
        enemy.getBoundingClientRect();

        const carRect =
        car.getBoundingClientRect();

        if(

            enemyRect.left < carRect.right &&
            enemyRect.right > carRect.left &&
            enemyRect.top < carRect.bottom &&
            enemyRect.bottom > carRect.top

        ){

            clearInterval(interval);

            endGame();

        }

        /* REMOVE */

        if(enemyY > window.innerHeight){

            clearInterval(interval);

            enemy.remove();

            score++;

            scoreText.innerHTML = score;

            /* SPEED UP */

            if(score % 5 === 0){

                speed += 1;

            }

        }

    },20);

}

/* GAME LOOP */

function gameLoop(){

    if(!gameRunning) return;

    moveCar();

    requestAnimationFrame(gameLoop);

}

/* CREATE ENEMIES */

setInterval(()=>{

    createEnemy();

},1200);

/* START */

gameLoop();

/* END GAME */

function endGame(){

    gameRunning = false;

    gameOver.style.display = "flex";

    finalScore.innerHTML =
    "⭐ Your Score : " + score;

}

/* RESTART */

function restartGame(){

    location.reload();

}

</script>

</body>
