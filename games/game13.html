<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍌 Banana Escape</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Comic Sans MS, cursive;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background: linear-gradient(135deg,#ffe259,#ffa751);
    overflow:hidden;
    width:100%;
    height:100vh;
    height:100dvh;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
    --player-size:clamp(46px,14vmin,60px);
    --item-size:clamp(32px,9.5vmin,45px);
    --control-size:clamp(58px,16vmin,80px);
}

/* HUD */
.hud{
    position:fixed;
    top:max(10px,env(safe-area-inset-top));
    left:max(8px,env(safe-area-inset-left));
    right:max(8px,env(safe-area-inset-right));
    width:auto;
    display:flex;
    justify-content:center;
    gap:clamp(6px,2vmin,10px);
    flex-wrap:wrap;
    z-index:1000;
    pointer-events:none;
}

.box{
    background:white;
    padding:clamp(7px,2vmin,10px) clamp(10px,3vmin,15px);
    border-radius:clamp(12px,3.8vmin,15px);
    font-size:clamp(14px,3.8vmin,18px);
    line-height:1.1;
    white-space:nowrap;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* GAME AREA */
#game{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    touch-action:none;
}

/* PLAYER */
.player{
    position:absolute;
    width:var(--player-size);
    height:var(--player-size);
    font-size:calc(var(--player-size) * .67);
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    border-radius:clamp(15px,4.5vmin,20px);
    box-shadow:0 0 20px rgba(0,0,0,.3);
    transition:0.08s;
    will-change:left,top;
}

/* BANANA */
.banana{
    position:absolute;
    width:var(--item-size);
    height:var(--item-size);
    display:grid;
    place-items:center;
    font-size:calc(var(--item-size) * .82);
    animation:float 1s infinite alternate;
    will-change:transform;
}

@keyframes float{
    from{transform:translateY(0px);}
    to{transform:translateY(-10px);}
}

/* TRAP */
.trap{
    position:absolute;
    width:var(--item-size);
    height:var(--item-size);
    display:grid;
    place-items:center;
    font-size:calc(var(--item-size) * .82);
    animation:shake 0.6s infinite;
    will-change:transform;
}

@keyframes shake{
    0%{transform:rotate(0deg);}
    50%{transform:rotate(10deg);}
    100%{transform:rotate(-10deg);}
}

/* EXIT */
.exit{
    position:absolute;
    width:var(--item-size);
    height:var(--item-size);
    display:grid;
    place-items:center;
    font-size:var(--item-size);
    animation:pulse 1s infinite;
    will-change:transform;
}

@keyframes pulse{
    50%{transform:scale(1.2);}
}

/* MESSAGE */
.message{
    position:fixed;
    left:max(8px,env(safe-area-inset-left));
    right:max(8px,env(safe-area-inset-right));
    bottom:max(14px,env(safe-area-inset-bottom));
    width:auto;
    text-align:center;
    font-size:clamp(16px,4.5vmin,22px);
    line-height:1.15;
    color:#333;
    font-weight:bold;
    z-index:900;
    overflow-wrap:anywhere;
    pointer-events:none;
}

/* TOUCH CONTROLS */
.controls{
    position:fixed;
    left:max(12px,env(safe-area-inset-left));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + clamp(34px,8vmin,48px));
    z-index:950;
    display:none;
    grid-template-columns:repeat(3,var(--control-size));
    gap:clamp(6px,1.8vmin,10px);
    touch-action:none;
}

.controls button{
    width:var(--control-size);
    height:var(--control-size);
    border:none;
    border-radius:clamp(16px,5vmin,20px);
    background:white;
    font-size:calc(var(--control-size) * .42);
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
    touch-action:none;
}

.controls button:active{
    transform:translateY(3px);
}

.empty{
    visibility:hidden;
}

@media(max-width:900px), (pointer:coarse){
    .controls{
        display:grid;
    }
}

@media(max-width:460px){
    .hud{
        justify-content:flex-start;
    }
}

@media(max-height:560px) and (orientation:landscape){
    body{
        --player-size:clamp(40px,13vmin,54px);
        --item-size:clamp(28px,9vmin,40px);
        --control-size:clamp(44px,12vmin,58px);
    }

    .box{
        padding:5px 9px;
        font-size:clamp(12px,3.2vmin,16px);
    }

    .message{
        font-size:clamp(14px,3.4vmin,18px);
    }

    .controls{
        left:auto;
        right:max(8px,env(safe-area-inset-right));
        bottom:max(8px,env(safe-area-inset-bottom));
    }
}

</style>
</head>

<body>

<div class="hud">
    <div class="box">🍌 Bananas: <span id="score">0</span></div>
    <div class="box">⏱ Time: <span id="time">60</span></div>
    <div class="box">🚀 Level: <span id="level">1</span></div>
</div>

<div id="game"></div>

<div class="message" id="message">Collect bananas & escape!</div>

<div class="controls" aria-label="Touch controls">
    <div class="empty"></div>
    <button type="button" aria-label="Move up" data-dx="0" data-dy="-1">⬆️</button>
    <div class="empty"></div>

    <button type="button" aria-label="Move left" data-dx="-1" data-dy="0">⬅️</button>
    <button type="button" aria-label="Move down" data-dx="0" data-dy="1">⬇️</button>
    <button type="button" aria-label="Move right" data-dx="1" data-dy="0">➡️</button>
</div>

<script>

const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const levelEl = document.getElementById("level");
const message = document.getElementById("message");
const hud = document.querySelector(".hud");
const controls = document.querySelector(".controls");

let player = {x:100, y:100};
let score = 0;
let time = 60;
let level = 1;

let bananas = [];
let traps = [];
let exit;

/* PLAYER */
const p = document.createElement("div");
p.className = "player";
p.innerHTML = "🐵";
game.appendChild(p);

function cssNumber(name){

    return parseFloat(
        getComputedStyle(document.body).getPropertyValue(name)
    ) || 0;

}

function playerSize(){

    const rect =
    p.getBoundingClientRect();

    return rect.width ||
    Math.min(
        60,
        Math.max(
            46,
            Math.min(innerWidth,innerHeight) * .14
        )
    );

}

function itemSize(){

    const sample =
    document.querySelector(".banana,.trap,.exit");

    if(sample){
        return sample.getBoundingClientRect().width || 40;
    }

    const compactLandscape =
    innerWidth > innerHeight &&
    innerHeight <= 560;

    return Math.min(
        compactLandscape ? 40 : 45,
        Math.max(
            compactLandscape ? 28 : 32,
            Math.min(innerWidth,innerHeight) *
            (compactLandscape ? .09 : .095)
        )
    );

}

function stepSize(){

    return Math.max(
        14,
        Math.round(playerSize() * .36)
    );

}

function controlsVisible(){

    return getComputedStyle(controls).display !== "none";

}

function safeArea(){

    const hudRect =
    hud.getBoundingClientRect();

    const msgRect =
    message.getBoundingClientRect();

    const controlRect =
    controlsVisible()
        ? controls.getBoundingClientRect()
        : {left:0,right:0,top:innerHeight,bottom:innerHeight,width:0,height:0};

    const landscapeControls =
    controlsVisible() &&
    innerWidth > innerHeight &&
    innerHeight <= 560;

    const size =
    playerSize();

    return {
        left: Math.max(8,landscapeControls ? 8 : 8),
        right: Math.max(
            8,
            landscapeControls
                ? controlRect.width + 24
                : 8
        ),
        top: Math.max(12,hudRect.bottom + 10),
        bottom: Math.max(
            12,
            msgRect.height + 24,
            controlsVisible() && !landscapeControls
                ? controlRect.height + msgRect.height + 40
                : 12
        ),
        size
    };

}

function clampPlayer(){

    const area =
    safeArea();

    player.x =
    Math.max(
        area.left,
        Math.min(
            innerWidth - area.right - area.size,
            player.x
        )
    );

    player.y =
    Math.max(
        area.top,
        Math.min(
            innerHeight - area.bottom - area.size,
            player.y
        )
    );

}

function randomPosition(size){

    const area =
    safeArea();

    const left =
    area.left;

    const right =
    Math.max(
        left,
        innerWidth - area.right - size
    );

    const top =
    area.top;

    const bottom =
    Math.max(
        top,
        innerHeight - area.bottom - size
    );

    return {
        x: left + Math.random() * Math.max(1,right-left),
        y: top + Math.random() * Math.max(1,bottom-top)
    };

}

function placeElement(el,x,y){

    el.dataset.x = x;
    el.dataset.y = y;
    el.style.left = x + "px";
    el.style.top = y + "px";

}

function resetPlayer(){

    const area =
    safeArea();

    player.x = area.left + 18;
    player.y = area.top + 18;

}

function moveByStep(dx,dy){

    const step =
    stepSize();

    player.x += dx * step;
    player.y += dy * step;

    updatePlayer();

}

/* MOVE PLAYER */
document.addEventListener("keydown",(e)=>{

    if(
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(e.key)
    ){
        e.preventDefault();
    }

    if(e.key==="ArrowUp") moveByStep(0,-1);
    if(e.key==="ArrowDown") moveByStep(0,1);
    if(e.key==="ArrowLeft") moveByStep(-1,0);
    if(e.key==="ArrowRight") moveByStep(1,0);
});

/* TOUCH MOVE */
let startX, startY;

game.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
},{passive:false});

game.addEventListener("touchmove",(e)=>{
    e.preventDefault();

    let dx = e.touches[0].clientX - startX;
    let dy = e.touches[0].clientY - startY;
    const threshold =
    Math.max(16,stepSize() * .9);

    if(
        Math.max(Math.abs(dx),Math.abs(dy)) <
        threshold
    ) return;

    if(Math.abs(dx) > Math.abs(dy)){
        moveByStep(dx > 0 ? 1 : -1,0);
        startX = e.touches[0].clientX;
    }else{
        moveByStep(0,dy > 0 ? 1 : -1);
        startY = e.touches[0].clientY;
    }

},{passive:false});

controls.querySelectorAll("button").forEach(button=>{

    const dx =
    Number(button.dataset.dx);

    const dy =
    Number(button.dataset.dy);

    let holdTimer;

    const start = (event)=>{
        event.preventDefault();
        moveByStep(dx,dy);
        clearInterval(holdTimer);
        holdTimer =
        setInterval(()=>moveByStep(dx,dy),130);
    };

    const stop = ()=>{
        clearInterval(holdTimer);
    };

    button.addEventListener("pointerdown",start);
    button.addEventListener("pointerup",stop);
    button.addEventListener("pointercancel",stop);
    button.addEventListener("pointerleave",stop);

});

/* UPDATE */
function updatePlayer(){

    clampPlayer();

    renderPlayer();

    checkBanana();
    checkTrap();
    checkExit();
}

function renderPlayer(){

    p.style.left = player.x + "px";
    p.style.top = player.y + "px";

}

/* SPAWN */
function spawn(){

    game.querySelectorAll(".banana,.trap,.exit").forEach(e=>e.remove());

    bananas = [];
    traps = [];

    // bananas
    for(let i=0;i<10;i++){
        let b = document.createElement("div");
        b.className = "banana";
        b.innerHTML = "🍌";
        const pos = randomPosition(itemSize());
        placeElement(b,pos.x,pos.y);
        game.appendChild(b);
        bananas.push(b);
    }

    // traps
    for(let i=0;i<level+3;i++){
        let t = document.createElement("div");
        t.className = "trap";
        t.innerHTML = "💣";
        const pos = randomPosition(itemSize());
        placeElement(t,pos.x,pos.y);
        game.appendChild(t);
        traps.push(t);
    }

    // exit
    exit = document.createElement("div");
    exit.className = "exit";
    exit.innerHTML = "🚪";
    const pos = randomPosition(itemSize());
    placeElement(exit,pos.x,pos.y);
    game.appendChild(exit);
}

/* CHECK BANANA */
function checkBanana(){

    bananas.forEach((b,i)=>{
        if(isClose(b)){
            b.remove();
            bananas.splice(i,1);
            score++;
            scoreEl.innerText = score;
            message.innerText = "Yummy 🍌";
        }
    });

}

/* CHECK TRAP */
function checkTrap(){

    traps.forEach(t=>{
        if(isClose(t)){
            message.innerText = "💥 Ouch!";
            resetPlayer();
            clampPlayer();
            renderPlayer();
        }
    });

}

/* CHECK EXIT */
function checkExit(){

    if(exit && isClose(exit) && bananas.length===0){

        level++;
        levelEl.innerText = level;

        time = 60;
        spawn();
        message.innerText = "Next level 🚀";
    }
}

/* DISTANCE */
function isClose(el){

    const playerCenterX =
    player.x + playerSize()/2;

    const playerCenterY =
    player.y + playerSize()/2;

    const rect =
    el.getBoundingClientRect();

    const elCenterX =
    rect.left + rect.width/2;

    const elCenterY =
    rect.top + rect.height/2;

    return Math.hypot(
        playerCenterX - elCenterX,
        playerCenterY - elCenterY
    ) < Math.max(
        28,
        (playerSize() + rect.width) * .42
    );
}

function fitExistingElements(){

    const size =
    itemSize();

    game.querySelectorAll(".banana,.trap,.exit").forEach(el=>{

        const x =
        Number(el.dataset.x || el.offsetLeft);

        const y =
        Number(el.dataset.y || el.offsetTop);

        const area =
        safeArea();

        placeElement(
            el,
            Math.max(
                area.left,
                Math.min(innerWidth-area.right-size,x)
            ),
            Math.max(
                area.top,
                Math.min(innerHeight-area.bottom-size,y)
            )
        );

    });

    updatePlayer();

}

let resizeTimer;

addEventListener("resize",()=>{

    clearTimeout(resizeTimer);

    resizeTimer =
    setTimeout(fitExistingElements,80);

});

addEventListener("orientationchange",()=>{

    setTimeout(fitExistingElements,180);

});

/* TIMER */
setInterval(()=>{
    time--;
    timeEl.innerText = time;

    if(time<=0){
        message.innerText = "Game Over 😢";
        location.reload();
    }
},1000);

/* START */
resetPlayer();
spawn();
updatePlayer();

</script>

</body>
</html>
