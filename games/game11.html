<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Hidden Magic Item</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Comic Sans MS, cursive;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

/* HUD */

.hud{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:1000;
}

.box{
    background:white;
    padding:8px 12px;
    border-radius:12px;
    font-size:14px;
}

/* GAME AREA */

#game{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* ITEMS */

.item{
    position:absolute;
    width:60px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    border-radius:15px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    touch-action:none;
    box-shadow:0 5px 10px rgba(0,0,0,0.15);
    background:white;
}

.item:hover{
    transform:scale(1.2);
}

.item.dragging{
    cursor:grabbing;
    transform:scale(1.08);
    transition:none;
    z-index:2000;
}

/* TARGET */

.target{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 20px;
    border-radius:20px;
    font-size:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* MESSAGE */

.message{
    position:fixed;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    font-size:25px;
    color:white;
    text-shadow:0 0 10px black;
}

</style>
<style>
.hub-home-link{position:fixed;top:14px;left:14px;z-index:5000;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;color:#16213f;background:rgba(255,255,255,.86);box-shadow:0 12px 28px rgba(20,30,60,.18);font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;font-size:14px;font-weight:900;text-decoration:none;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease}.hub-home-link:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(20,30,60,.25)}
html,body,#game{max-width:100%;touch-action:manipulation}.hud{top:62px;width:min(92vw,640px);justify-content:center;flex-wrap:wrap}.box{min-height:38px;font-size:clamp(12px,3.4vw,14px)}.item{width:clamp(48px,14vw,60px);height:clamp(48px,14vw,60px);font-size:clamp(28px,8vw,35px)}.target{bottom:12px;width:min(360px,92vw);text-align:center;font-size:clamp(16px,4vw,20px)}.message{top:112px;width:min(92vw,620px);text-align:center;font-size:clamp(18px,5vw,25px);line-height:1.2}@media(max-width:560px){.hub-home-link{top:10px;left:10px;min-height:40px;padding:8px 12px}.hud{gap:6px}}
</style>
</head>

<body>
<a class="hub-home-link" href="../index.html">🏠 Home</a>

<div class="hud">
    <div class="box">⭐ Score: <span id="score">0</span></div>
    <div class="box">🏆 Level: <span id="level">1</span></div>
</div>

<div class="message" id="message">Find the hidden item!</div>

<div id="game"></div>

<div class="target">
    🎯 Find: <span id="target"></span>
</div>

<script>

const game = document.getElementById("game");
const targetEl = document.getElementById("target");
const message = document.getElementById("message");

const itemsList = ["🍎","🍌","🚗","🐱","🎈","⚽","🧸","🎮","⭐","🍕"];

let target = "";
let score = 0;
let level = 1;

/* CREATE ITEMS */

function createItems(){

    game.innerHTML = "";

    let count = 25 + level * 5;

    // 🎯 choose ONE hidden item
    target = itemsList[Math.floor(Math.random()*itemsList.length)];
    targetEl.innerHTML = target;

    const hiddenIndex = Math.floor(Math.random()*count);

    for(let i=0;i<count;i++){

        const item = document.createElement("div");
        item.className = "item";

        let emoji;

        if(i === hiddenIndex){
            emoji = target; // ONLY ONE HIDDEN ITEM
        }else{
            do{
                emoji = itemsList[Math.floor(Math.random()*itemsList.length)];
            }while(emoji === target);
        }

        item.innerHTML = emoji;

        item.style.left = Math.random()*(window.innerWidth-60)+"px";
        item.style.top = Math.random()*(window.innerHeight-120)+"px";

        item.style.background = "white";

        /* DRAG SYSTEM */
        let isDragging = false;
        let suppressClick = false;
        let startX = 0;
        let startY = 0;
        let offsetX = 0;
        let offsetY = 0;

        function clamp(value,min,max){
            return Math.max(min,Math.min(value,max));
        }

        function moveItem(e){
            if(!isDragging) return;

            const gameRect = game.getBoundingClientRect();
            const maxX = gameRect.width - item.offsetWidth;
            const maxY = gameRect.height - item.offsetHeight;
            const nextX = e.clientX - gameRect.left - offsetX;
            const nextY = e.clientY - gameRect.top - offsetY;

            if(Math.abs(e.clientX-startX) > 6 || Math.abs(e.clientY-startY) > 6){
                suppressClick = true;
            }

            item.style.left = clamp(nextX,0,maxX)+"px";
            item.style.top = clamp(nextY,0,maxY)+"px";
        }

        function stopDrag(){
            if(!isDragging) return;

            isDragging = false;
            item.classList.remove("dragging");
            document.removeEventListener("pointermove",moveItem);
            document.removeEventListener("pointerup",stopDrag);
            document.removeEventListener("pointercancel",stopDrag);
        }

        item.addEventListener("pointerdown",(e)=>{
            const itemRect = item.getBoundingClientRect();

            isDragging = true;
            suppressClick = false;
            startX = e.clientX;
            startY = e.clientY;
            offsetX = e.clientX - itemRect.left;
            offsetY = e.clientY - itemRect.top;

            item.classList.add("dragging");
            item.setPointerCapture(e.pointerId);

            document.addEventListener("pointermove",moveItem);
            document.addEventListener("pointerup",stopDrag);
            document.addEventListener("pointercancel",stopDrag);
        });

        /* CLICK CHECK */

        item.onclick = ()=>{

            if(suppressClick){
                suppressClick = false;
                return;
            }

            if(item.innerHTML === target){

                score++;
                document.getElementById("score").innerText = score;

                message.innerText = "🎉 Great! You found it!";
                winSound();

                level++;

                setTimeout(()=>{
                    createItems();
                },800);

            }else{

                message.innerText = "❌ Try again!";
                failSound();
            }

        };

        game.appendChild(item);
    }
}

/* SOUNDS */

function winSound(){
    new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg").play();
}

function failSound(){
    new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg").play();
}

/* START */

createItems();

</script>

</body>
</html>
