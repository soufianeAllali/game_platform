<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔥 ULTRA MAZE QUEST 🔥</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Comic Sans MS,cursive;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    overflow:hidden;
    background:
    linear-gradient(135deg,#0f172a,#111827);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(6px,1.4vmin,12px);
    width:100%;
    height:100vh;
    height:100dvh;
    padding:
    max(8px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(8px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
}

.home-btn{
    position:fixed;
    top:max(10px,env(safe-area-inset-top));
    left:max(10px,env(safe-area-inset-left));
    z-index:500;
    min-width:58px;
    min-height:42px;
    display:grid;
    place-items:center;
    padding:8px 14px;
    border-radius:999px;
    color:white;
    text-decoration:none;
    font-weight:900;
    font-size:16px;
    background:rgba(15,23,42,.72);
    border:2px solid rgba(255,255,255,.48);
    box-shadow:0 10px 24px rgba(0,0,0,.26),0 0 18px rgba(0,255,255,.22);
    backdrop-filter:blur(12px);
    touch-action:manipulation;
}

.home-btn:active{
    transform:translateY(2px);
}

/* TITLE */

.title{
    color:white;
    width:min(100%,720px);
    font-size:clamp(24px,6.6vmin,45px);
    line-height:1;
    margin-bottom:0;
    text-align:center;
    text-shadow:0 0 20px cyan;
    animation:pulse 2s infinite;
    overflow-wrap:anywhere;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}

/* HUD */

.hud{
    display:flex;
    gap:clamp(6px,1.8vmin,12px);
    margin-bottom:0;
    flex-wrap:wrap;
    justify-content:center;
    width:min(100%,720px);
}

.box{
    background:white;
    padding:clamp(7px,1.8vmin,10px) clamp(10px,3vmin,18px);
    border-radius:clamp(12px,3vmin,18px);
    font-size:clamp(14px,3.2vmin,20px);
    line-height:1.1;
    white-space:nowrap;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

/* GAME */

#game{
    position:relative;
    width:95vmin;
    height:95vmin;
    max-width:720px;
    max-height:720px;
    background:#0b1220;
    overflow:hidden;
    border:clamp(4px,1.4vmin,8px) solid white;
    border-radius:clamp(16px,4vmin,25px);
    box-shadow:0 0 40px rgba(0,255,255,.3);
    flex:0 0 auto;
    touch-action:none;
    transition:transform .08s linear;
}

/* CELLS */

.cell{
    position:absolute;
}

/* WALL */

.wall{
    background:
    linear-gradient(135deg,#00c6ff,#0072ff);
    border-radius:10px;
    box-shadow:0 0 10px cyan;
}

/* FLOOR */

.floor{
    background:#1e293b;
}

/* PLAYER */

.player{
    position:absolute;
    width:var(--cell-size,40px);
    height:var(--cell-size,40px);
    border-radius:clamp(7px,30%,12px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:calc(var(--cell-size,40px) * .6);
    background:
    linear-gradient(135deg,#ffe259,#ffa751);
    box-shadow:0 0 20px gold;
    z-index:100;
    transition:.08s linear;
}

/* EXIT */

.exit{
    position:absolute;
    width:var(--cell-size,40px);
    height:var(--cell-size,40px);
    border-radius:clamp(7px,30%,12px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:calc(var(--cell-size,40px) * .6);
    background:
    linear-gradient(135deg,#ff416c,#ff4b2b);
    box-shadow:0 0 20px red;
    animation:doorGlow 1s infinite alternate;
}

@keyframes doorGlow{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

/* ENEMY */

.enemy{
    position:absolute;
    width:var(--cell-size,40px);
    height:var(--cell-size,40px);
    border-radius:clamp(7px,30%,12px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:calc(var(--cell-size,40px) * .55);
    background:
    linear-gradient(135deg,#ff0000,#8b0000);
    box-shadow:0 0 20px red;
    z-index:90;
}

/* KEY */

.key{
    position:absolute;
    width:var(--cell-size,40px);
    height:var(--cell-size,40px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:calc(var(--cell-size,40px) * .6);
    animation:keyFloat 1s infinite alternate;
}

@keyframes keyFloat{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-6px);
    }
}

/* COIN */

.coin{
    position:absolute;
    width:calc(var(--cell-size,40px) * .875);
    height:calc(var(--cell-size,40px) * .875);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:calc(var(--cell-size,40px) * .55);
    animation:coinSpin 1s infinite linear;
}

@keyframes coinSpin{
    from{
        transform:rotateY(0deg);
    }
    to{
        transform:rotateY(360deg);
    }
}

/* MESSAGE */

.message{
    position:absolute;
    top:clamp(6px,1.6vmin,10px);
    left:0;
    width:100%;
    padding:0 clamp(8px,2.5vmin,16px);
    text-align:center;
    color:white;
    font-size:clamp(14px,3.4vmin,24px);
    line-height:1.15;
    z-index:200;
    text-shadow:0 0 10px black;
    overflow-wrap:anywhere;
}

/* FOG */

#fog{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:150;
}

/* CONTROLS */

.controls{
    margin-top:0;
    display:grid;
    grid-template-columns:repeat(3,clamp(56px,16vmin,80px));
    gap:clamp(6px,1.8vmin,10px);
    flex:0 0 auto;
    touch-action:none;
}

.controls button{
    width:clamp(56px,16vmin,80px);
    height:clamp(56px,16vmin,80px);
    border:none;
    border-radius:clamp(14px,4vmin,20px);
    font-size:clamp(22px,6vmin,30px);
    cursor:pointer;
    background:white;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
    touch-action:none;
}

.controls button:active{
    transform:translateY(3px);
}

.empty{
    visibility:hidden;
}

@media(min-width:900px){
    .controls{
        display:none;
    }
}

@media(max-width:520px){
    body{
        justify-content:flex-start;
    }

    .hud{
        gap:6px;
    }
}

@media(max-height:560px) and (orientation:landscape){
    body{
        gap:4px;
        padding:
        max(4px,env(safe-area-inset-top))
        max(6px,env(safe-area-inset-right))
        max(4px,env(safe-area-inset-bottom))
        max(6px,env(safe-area-inset-left));
    }

    .title{
        font-size:clamp(18px,5.2vmin,30px);
    }

    .box{
        padding:5px 9px;
        font-size:clamp(12px,3vmin,16px);
    }

    .controls{
        position:fixed;
        right:max(8px,env(safe-area-inset-right));
        bottom:max(8px,env(safe-area-inset-bottom));
        grid-template-columns:repeat(3,clamp(44px,11vmin,58px));
        gap:6px;
    }

    .controls button{
        width:clamp(44px,11vmin,58px);
        height:clamp(44px,11vmin,58px);
        font-size:clamp(18px,4.5vmin,24px);
    }
}

</style>

function levelMetrics(index){

    const map =
    levels[
        Math.min(index,levels.length-1)
    ];

    return {
        cols: Math.max(
            18,
            ...map.map(row=>row.length)
        ),
        rows: map.length
    };

}

function setCellBox(el,x,y){

    el.dataset.x = x;
    el.dataset.y = y;

    el.style.left =
    x*size+"px";

    el.style.top =
    y*size+"px";

    el.style.width =
    (
        el.classList.contains("coin")
            ? size*.875
            : size
    )+"px";

    el.style.height =
    (
        el.classList.contains("coin")
            ? size*.875
            : size
    )+"px";

}

function syncMazeSize(){

    const metrics =
    levelMetrics(currentLevel);

    mazeCols = metrics.cols;
    mazeRows = metrics.rows;

    const controlsVisible =
    getComputedStyle(controls).display !== "none";

    const landscapeControls =
    controlsVisible &&
    innerWidth > innerHeight &&
    innerHeight <= 560;

    const titleHeight =
    title.getBoundingClientRect().height;

    const hudHeight =
    hud.getBoundingClientRect().height;

    const controlsHeight =
    controlsVisible && !landscapeControls
        ? controls.getBoundingClientRect().height
        : 0;

    const reservedHeight =
    titleHeight + hudHeight + controlsHeight + 44;

    const reservedWidth =
    landscapeControls
        ? controls.getBoundingClientRect().width + 26
        : 18;

    const style =
    getComputedStyle(game);

    const border =
    parseFloat(style.borderLeftWidth) +
    parseFloat(style.borderRightWidth);

    const verticalBorder =
    parseFloat(style.borderTopWidth) +
    parseFloat(style.borderBottomWidth);

    const availableWidth =
    Math.max(240,innerWidth - reservedWidth - border);

    const availableHeight =
    Math.max(220,innerHeight - reservedHeight - verticalBorder);

    size = Math.max(
        18,
        Math.min(
            baseSize,
            Math.floor(availableWidth / mazeCols),
            Math.floor(availableHeight / mazeRows)
        )
    );

    game.style.width =
    mazeCols*size+"px";

    game.style.height =
    mazeRows*size+"px";

    game.style.setProperty(
        "--cell-size",
        size+"px"
    );

    fog.width =
    mazeCols*size;

    fog.height =
    mazeRows*size;

    fog.style.width = "100%";
    fog.style.height = "100%";

    game.style.marginRight =
    landscapeControls
        ? controls.getBoundingClientRect().width + 16 + "px"
        : "0px";

    game.querySelectorAll(
        ".cell,.enemy,.coin,.key,.exit"
    ).forEach(el=>{

        if(
            el.dataset.x !== undefined &&
            el.dataset.y !== undefined
        ){
            setCellBox(
                el,
                Number(el.dataset.x),
                Number(el.dataset.y)
            );
        }

    });

    updatePlayer();

}

function isWall(x,y){

    const map =
    levels[currentLevel];

    if(!map) return true;

    return (
        y < 0 ||
        y >= map.length ||
        x < 0 ||
        x >= map[y].length ||
        map[y][x] === "#"
    );

}

function distance(a,b){

    return Math.abs(a.x-b.x) +
    Math.abs(a.y-b.y);

}

            document.createElement("div");

            div.className =

            setCellBox(div,x,y);

            if(cell === "#"){

                div.classList.add("wall");

                walls.push({x,y});

            }else{

                div.classList.add("floor");

            }

            game.appendChild(div);

            /* PLAYER */

            if(cell === "P"){

                playerX = x;
                playerY = y;

            }

            /* EXIT */

            if(cell === "E"){

                const exit =
                document.createElement("div");

                exit.className = "exit";

                exit.innerHTML = "🚪";

                setCellBox(exit,x,y);

                exit.id = "exit";

                game.appendChild(exit);

                key.className = "key";

                key.innerHTML = "🔑";

                setCellBox(key,x,y);

                key.id = "key";

                game.appendChild(key);

            }

            /* COIN */

            if(cell === "C"){

                const coin =
                document.createElement("div");

                coin.className = "coin";

                coin.innerHTML = "💰";

                setCellBox(coin,x,y);

                game.appendChild(coin);

                coins.push({
                    x,y,el:coin
                });

            }

            if(enemySymbols[cell]){

                createEnemy(
                    x,
                    y,
                    enemySymbols[cell]
                );

            }

        });

    });

    updatePlayer();

}

/* ENEMIES */

function createEnemy(x,y,type="normal"){

    const enemy =
    document.createElement("div");

    const config =
    enemyTypes[type] ||
    enemyTypes.normal;

    enemy.className =
    "enemy";

    enemy.innerHTML =
    config.icon;

    setCellBox(enemy,x,y);

    if(type === "ambush"){
        enemy.style.display = "none";
    }

    game.appendChild(enemy);

    enemies.push({
        x,
        y,
        el:enemy,
        type,
        wait:0,
        awake:type !== "ambush",
        home:{x,y}
    });

}

/* UPDATE PLAYER */

function updatePlayer(){

    player.style.left =
    playerX*size+"px";

    player.style.top =
    playerY*size+"px";

    drawFog();

}

/* MOVE */

function move(dx,dy){

    if(gameFinished || changingLevel) return;

    let nx = playerX + dx;
    let ny = playerY + dy;

    const hit =
    isWall(nx,ny);

    if(hit){

        shake();

        return;
    }

    playerX = nx;
    playerY = ny;

    updatePlayer();

    checkCoin();
    checkKey();
    checkExit();
    checkEnemy();

}

/* COIN */

function checkCoin(){

    coins.forEach((coin,index)=>{

        if(
            coin.x===playerX &&
            coin.y===playerY
        ){

            coin.el.remove();

            coins.splice(index,1);

            score += 10;

            scoreEl.innerHTML =
            score;

            speak("Coin!");

        }

    });

}

/* KEY */

function checkKey(){

    const key =
    document.getElementById("key");

    if(
        key &&
        Math.abs(
            player.offsetLeft -
            key.offsetLeft
        ) < 10 &&

        Math.abs(
            player.offsetTop -
            key.offsetTop
        ) < 10
    ){

        key.remove();

        hasKey = true;

        message.innerHTML =
        "🚪 Escape now!";

        speak(
            "You found the key"
        );

    }

}

/* EXIT */

function checkExit(){

    const exit =
    document.getElementById("exit");

    if(
        Math.abs(
            player.offsetLeft -
            exit.offsetLeft
        ) < 10 &&

        Math.abs(
            player.offsetTop -
            exit.offsetTop
        ) < 10
    ){

        if(hasKey){

            score += 100;

            scoreEl.innerHTML =
            score;

            currentLevel++;

            if(
                currentLevel >=
                levels.length
            ){

                gameFinished = true;

                message.innerHTML =
                "🏆 YOU WON!";

                speak(
                    "You completed all levels!"
                );

                return;

            }

            levelEl.innerHTML =
            currentLevel + 1;

            message.innerHTML =
            "🎉 NEXT LEVEL!";

            speak(
                "Next level"
            );

            changingLevel = true;

            setTimeout(()=>{

                loadLevel(currentLevel);

            },1200);

        }else{

            message.innerHTML =
            "🔑 Need the key first!";

        }

    }

}

/* ENEMY COLLISION */

function checkEnemy(){

    enemies.forEach(enemy=>{

        if(!enemy.awake) return;

        if(
            enemy.x===playerX &&
            enemy.y===playerY
        ){

            const config =
            enemyTypes[enemy.type] ||
            enemyTypes.normal;

            lives -= config.damage;

            livesEl.innerHTML =
            Math.max(0,lives);

            shake();

            speak("Ouch!");

            if(lives<=0){

                alert("GAME OVER");

                location.reload();

            }

        }

    });

}

/* ENEMY MOVEMENT */

function nextStepToward(enemy,target){

    const startKey =
    enemy.x + "," + enemy.y;

    const queue = [{
        x:enemy.x,
        y:enemy.y,
        first:null
    }];

    const seen =
    new Set([startKey]);

    for(let i=0;i<queue.length;i++){

        const node =
        queue[i];

        if(
            node.x === target.x &&
            node.y === target.y
        ){
            return node.first;
        }

        [
            [1,0],
            [-1,0],
            [0,1],
            [0,-1]
        ].forEach(dir=>{

            const nx =
            node.x + dir[0];

            const ny =
            node.y + dir[1];

            const key =
            nx + "," + ny;

            if(
                seen.has(key) ||
                isWall(nx,ny)
            ) return;

            seen.add(key);

            queue.push({
                x:nx,
                y:ny,
                first:node.first || dir
            });

        });

    }

    return null;

}

function randomEnemyStep(enemy){

    const dirs =
    [
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ].filter(dir=>
        !isWall(
            enemy.x + dir[0],
            enemy.y + dir[1]
        )
    );

    return dirs[
        Math.floor(Math.random()*dirs.length)
    ] || null;

}

function exitTarget(){

    const exit =
    document.getElementById("exit");

    return {
        x:Number(exit.dataset.x),
        y:Number(exit.dataset.y)
    };

}

function enemyTarget(enemy){

    if(enemy.type === "guard" && !hasKey){
        return exitTarget();
    }

    const lookAhead =
    Math.min(
        2,
        Math.floor(currentLevel/7)
    );

    return {
        x:playerX + Math.sign(playerX-enemy.x)*lookAhead,
        y:playerY + Math.sign(playerY-enemy.y)*lookAhead
    };

}

function wakeAmbush(enemy){

    if(enemy.awake) return;

    if(
        hasKey ||
        distance(enemy,{x:playerX,y:playerY}) <= 5
    ){
        enemy.awake = true;
        enemy.el.style.display = "flex";
    }

}

function moveEnemy(enemy){

    wakeAmbush(enemy);

    if(!enemy.awake) return;

    const config =
    enemyTypes[enemy.type] ||
    enemyTypes.normal;

    const levelBoost =
    Math.min(.48,currentLevel*.035);

    const smartChance =
    Math.min(
        .9,
        config.smart + currentLevel*.035
    );

    const target =
    enemyTarget(enemy);

    let d =
    Math.random() < smartChance
        ? nextStepToward(enemy,target)
        : randomEnemyStep(enemy);

    if(!d){
        d = randomEnemyStep(enemy);
    }

    if(!d) return;

    const nx =
    enemy.x + d[0];

    const ny =
    enemy.y + d[1];

    if(isWall(nx,ny)) return;

    enemy.x = nx;
    enemy.y = ny;

    setCellBox(enemy.el,nx,ny);

    enemy.wait =
    -config.delay * levelBoost;

}

setInterval(()=>{

    if(gameFinished || changingLevel) return;

    enemies.forEach(enemy=>{

        const config =
        enemyTypes[enemy.type] ||
        enemyTypes.normal;

        enemy.wait += 160;

        const levelDelay =
        Math.max(
            260,
            config.delay - currentLevel*24
        );

        if(enemy.wait >= levelDelay){
            enemy.wait = 0;
            moveEnemy(enemy);
        }

    });

    checkEnemy();

},160);

/* SHAKE */

function shake(){

    game.style.transform =
    "translateX(10px)";

    setTimeout(()=>{
        game.style.transform =
        "translateX(-10px)";
    },50);

    setTimeout(()=>{
        game.style.transform =
        "translateX(0)";
    },100);

}

/* FOG */

function drawFog(){

    ctx.clearRect(
        0,0,
        fog.width,
        fog.height
    );

    ctx.fillStyle =
    "rgba(0,0,0,.88)";

    ctx.fillRect(
        0,0,
        fog.width,
        fog.height
    );

    ctx.globalCompositeOperation =
    "destination-out";

    ctx.beginPath();

    ctx.arc(
        playerX*size+size/2,
        playerY*size+size/2,
        size*3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalCompositeOperation =
    "source-over";

}

/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

    if(
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(e.key)
    ){
        e.preventDefault();
    }

    if(e.key==="ArrowUp")
        move(0,-1);

    if(e.key==="ArrowDown")
        move(0,1);

    if(e.key==="ArrowLeft")
        move(-1,0);

    if(e.key==="ArrowRight")
        move(1,0);

});

/* TOUCH */

let sx = 0;
let sy = 0;

game.addEventListener("touchstart",(e)=>{

    e.preventDefault();

    sx =
    e.touches[0].clientX;

    sy =
    e.touches[0].clientY;

},{passive:false});

game.addEventListener("touchmove",(e)=>{

    e.preventDefault();

    let dx =
    e.touches[0].clientX - sx;

    let dy =
    e.touches[0].clientY - sy;

    if(Math.abs(dx) > Math.abs(dy)){

        if(dx > 30){
            move(1,0);
            sx =
            e.touches[0].clientX;
        }

        if(dx < -30){
            move(-1,0);
            sx =
            e.touches[0].clientX;
        }

    }else{

        if(dy > 30){
            move(0,1);
            sy =
            e.touches[0].clientY;
        }

        if(dy < -30){
            move(0,-1);
            sy =
            e.touches[0].clientY;
        }

    }

},{passive:false});

let resizeTimer;

addEventListener("resize",()=>{

    clearTimeout(resizeTimer);

    resizeTimer =
    setTimeout(syncMazeSize,80);

});

addEventListener("orientationchange",()=>{

    setTimeout(syncMazeSize,180);

});

/* VOICE */

function speak(text){

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 1;

    speechSynthesis.cancel();

    speechSynthesis.speak(speech);

}

/* START */

loadLevel(currentLevel);

</script>
