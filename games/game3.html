<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Adventure</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Comic Sans MS, cursive;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(to bottom,#6ed6ff,#b7f7ff);
}

/* GAME AREA */

#game{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* HUD */

.hud{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:100;
}

.box{
    background:white;
    padding:15px 30px;
    border-radius:20px;
    font-size:28px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* TITLE */

.title{
    position:absolute;
    top:100px;
    width:100%;
    text-align:center;
    font-size:70px;
    color:white;
    text-shadow:4px 4px #ff8a00;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-10px);
    }
}

/* GROUND */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:170px;
    background:#3cb043;
}

/* PLAYER */

.player{
    position:absolute;
    width:90px;
    height:90px;
    bottom:170px;
    left:120px;
    transition:.1s linear;
}

/* FACE */

.face{
    width:70px;
    height:70px;
    background:#ffd2a6;
    border-radius:50%;
    position:absolute;
    top:0;
    left:10px;
}

/* EYES */

.eye{
    width:10px;
    height:10px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:25px;
}

.eye1{
    left:18px;
}

.eye2{
    right:18px;
}

/* SMILE */

.smile{
    width:25px;
    height:12px;
    border-bottom:4px solid black;
    border-radius:0 0 20px 20px;
    position:absolute;
    bottom:15px;
    left:22px;
}

/* BODY */

.body{
    width:55px;
    height:45px;
    background:#ff4da6;
    position:absolute;
    bottom:-20px;
    left:18px;
    border-radius:15px;
}

/* COINS */

.coin{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:gold;
    box-shadow:0 0 25px gold;
    animation:spin 1s infinite linear;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
}

@keyframes spin{
    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(360deg);
    }
}

/* BOMBS */

.bomb{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:black;
    box-shadow:0 0 25px red;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    animation:bombMove .7s infinite alternate;
}

@keyframes bombMove{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.1);
    }
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:200px;
    height:70px;
    background:white;
    border-radius:50px;
    opacity:.8;
    animation:cloudMove linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud::before{
    width:80px;
    height:80px;
    top:-35px;
    left:25px;
}

.cloud::after{
    width:100px;
    height:100px;
    top:-45px;
    right:20px;
}

@keyframes cloudMove{
    from{
        transform:translateX(-300px);
    }

    to{
        transform:translateX(1800px);
    }
}

/* GAME OVER */

.gameOver{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:200;
}

.gameOver h1{
    font-size:90px;
}

.gameOver button{
    margin-top:25px;
    padding:15px 40px;
    border:none;
    border-radius:20px;
    background:#ff8a00;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.gameOver button:hover{
    transform:scale(1.1);
}

</style>
<style>
.hub-home-link{position:fixed;top:14px;left:14px;z-index:5000;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;color:#16213f;background:rgba(255,255,255,.86);box-shadow:0 12px 28px rgba(20,30,60,.18);font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;font-size:14px;font-weight:900;text-decoration:none;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease}.hub-home-link:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(20,30,60,.25)}
html,body,#game{max-width:100%;touch-action:manipulation}.hud{width:min(92vw,720px);justify-content:center;flex-wrap:wrap;gap:10px}.box{min-height:46px;padding:10px 14px;font-size:clamp(16px,4vw,28px)}.title{top:clamp(76px,12vh,100px);font-size:clamp(30px,9vw,70px);padding:0 14px}.gameOver{padding:24px;text-align:center}.gameOver h1{font-size:clamp(42px,12vw,90px)}.gameOver h2{font-size:clamp(20px,6vw,34px)}.gameOver button{min-height:54px;font-size:clamp(18px,5vw,28px)}@media(max-width:560px){.hud{top:62px}.hub-home-link{top:10px;left:10px;min-height:40px;padding:8px 12px}}
</style>
</head>

<body>
<a class="hub-home-link" href="../index.html">🏠 Home</a>

<div class="hud">

    <div class="box">
        💰 Coins :
        <span id="score">0</span>
    </div>

    <div class="box">
        ❤️ Lives :
        <span id="lives">3</span>
    </div>

</div>

<div class="title">
    🏆 TREASURE ADVENTURE 🏆
</div>

<div id="game">

    <!-- CLOUDS -->

    <div class="cloud" style="top:80px;animation-duration:25s;"></div>
    <div class="cloud" style="top:160px;animation-duration:35s;transform:scale(.8);"></div>

    <!-- PLAYER -->

    <div class="player" id="player">

        <div class="face">
            <div class="eye eye1"></div>
            <div class="eye eye2"></div>
            <div class="smile"></div>
        </div>

        <div class="body"></div>

    </div>

    <div class="ground"></div>

</div>

<div class="gameOver" id="gameOver">

    <h1>🎮 GAME OVER 🎮</h1>

    <h2 id="finalText"></h2>

    <button onclick="restartGame()">
        PLAY AGAIN
    </button>

</div>

<script>

/* ELEMENTS */

const player =
document.getElementById("player");

const game =
document.getElementById("game");

const scoreText =
document.getElementById("score");

const livesText =
document.getElementById("lives");

const gameOver =
document.getElementById("gameOver");

const finalText =
document.getElementById("finalText");

/* VARIABLES */

let score = 0;
let lives = 3;

let playerX = 120;

const keys = {};

let gameRunning = true;

/* KEYS */

document.addEventListener("keydown",(e)=>{

    keys[e.key] = true;

});

document.addEventListener("keyup",(e)=>{

    keys[e.key] = false;

});

/* TOUCH CONTROLS */

function setPlayerFromTouch(e){

    if(!gameRunning) return;

    const touch = e.touches ? e.touches[0] : e;
    const nextX = touch.clientX - player.offsetWidth / 2;
    const maxX = window.innerWidth - player.offsetWidth;

    playerX = Math.max(0,Math.min(nextX,maxX));
    player.style.left = playerX + "px";
}

document.addEventListener("touchstart",(e)=>{

    if(!gameRunning || e.target.closest(".hub-home-link") || e.target.closest("button")) return;

    e.preventDefault();
    setPlayerFromTouch(e);

},{passive:false});

document.addEventListener("touchmove",(e)=>{

    if(!gameRunning || e.target.closest(".hub-home-link") || e.target.closest("button")) return;

    e.preventDefault();
    setPlayerFromTouch(e);

},{passive:false});

document.addEventListener("touchend",()=>{

    keys["ArrowLeft"] = false;
    keys["ArrowRight"] = false;

});

let mouseMovingPlayer = false;

document.addEventListener("mousedown",(e)=>{

    if(e.target.closest(".hub-home-link")) return;

    mouseMovingPlayer = true;
    setPlayerFromTouch(e);

});

document.addEventListener("mousemove",(e)=>{

    if(mouseMovingPlayer){
        setPlayerFromTouch(e);
    }

});

document.addEventListener("mouseup",()=>{

    mouseMovingPlayer = false;

});

/* PLAYER MOVE */

function movePlayer(){

    if(keys["ArrowLeft"] && playerX > 0){

        playerX -= 8;

    }

    if(keys["ArrowRight"] && playerX < window.innerWidth - 100){

        playerX += 8;

    }

    player.style.left = playerX + "px";

    requestAnimationFrame(movePlayer);

}

movePlayer();

/* CREATE COIN */

function createCoin(){

    if(!gameRunning) return;

    const coin =
    document.createElement("div");

    coin.className = "coin";

    coin.innerHTML = "💰";

    coin.style.left =
    Math.random()*
    (window.innerWidth - 70)
    +"px";

    coin.style.top = "-100px";

    game.appendChild(coin);

    fallObject(coin,"coin");

}

/* CREATE BOMB */

function createBomb(){

    if(!gameRunning) return;

    const bomb =
    document.createElement("div");

    bomb.className = "bomb";

    bomb.innerHTML = "💣";

    bomb.style.left =
    Math.random()*
    (window.innerWidth - 80)
    +"px";

    bomb.style.top = "-100px";

    game.appendChild(bomb);

    fallObject(bomb,"bomb");

}

/* FALL LOGIC */

function fallObject(obj,type){

    let y = -100;

    const speed =
    Math.random()*4 + 4;

    const interval =
    setInterval(()=>{

        if(!gameRunning){

            clearInterval(interval);

            return;

        }

        y += speed;

        obj.style.top = y + "px";

        const objRect =
        obj.getBoundingClientRect();

        const playerRect =
        player.getBoundingClientRect();

        /* COLLISION */

        if(

            objRect.left < playerRect.right &&
            objRect.right > playerRect.left &&
            objRect.top < playerRect.bottom &&
            objRect.bottom > playerRect.top

        ){

            clearInterval(interval);

            obj.remove();

            if(type === "coin"){

                score++;

                scoreText.innerHTML = score;

                playCoin();

            }

            if(type === "bomb"){

                lives--;

                livesText.innerHTML = lives;

                playBomb();

                if(lives <= 0){

                    endGame();

                }

            }

        }

        /* REMOVE */

        if(y > window.innerHeight){

            clearInterval(interval);

            obj.remove();

        }

    },20);

}

/* SPAWN */

setInterval(()=>{

    createCoin();

},900);

setInterval(()=>{

    createBomb();

},1800);

/* END GAME */

function endGame(){

    gameRunning = false;

    gameOver.style.display = "flex";

    finalText.innerHTML =
    "⭐ You Collected " + score + " Coins";

}

/* RESTART */

function restartGame(){

    location.reload();

}

/* SOUNDS */

function playCoin(){

    const audio =
    new Audio(
    "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
    );

    audio.volume = .3;

    audio.play();

}

function playBomb(){

    const audio =
    new Audio(
    "https://actions.google.com/sounds/v1/explosions/explosion.ogg"
    );

    audio.volume = .2;

    audio.play();

}

</script>

</body>
</html>
