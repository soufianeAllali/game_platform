<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pro Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            color: #fff;
            overflow: hidden;
            padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
            touch-action: none;
        }

        .home-btn {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            z-index: 30;
            min-height: 42px;
            padding: 9px 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.84);
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(1.7rem, 6vw, 2.5rem);
            margin-bottom: 10px;
            color: #00f2fe;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .score-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            margin-bottom: 12px;
            background: #16213e;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }

        .score-box span {
            font-weight: bold;
            color: #4facfe;
        }

        #game-container {
            position: relative;
            width: min(400px, calc(100vw - 28px));
            aspect-ratio: 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            border: 4px solid #0f3460;
            border-radius: 10px;
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.3s ease;
            padding: 18px;
        }

        .hidden {
            display: none !important;
        }

        .overlay h2 {
            font-size: clamp(1.35rem, 6vw, 2rem);
            color: #ff4757;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: white;
            min-height: 46px;
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #b5c0d0;
            text-align: center;
            line-height: 1.5;
        }

        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, clamp(68px, 18vw, 82px));
            grid-template-rows: repeat(2, clamp(64px, 16vw, 76px));
            gap: clamp(14px, 4vw, 22px);
            justify-content: center;
            align-items: center;
            margin-top: clamp(18px, 4vw, 26px);
            padding: 4px max(8px, env(safe-area-inset-left)) max(4px, env(safe-area-inset-bottom));
            touch-action: manipulation;
        }

        .touch-controls button {
            border: 1px solid #0f3460;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border-radius: 18px;
            background: #16213e;
            color: #dff9ff;
            font-size: clamp(1.55rem, 6vw, 2.1rem);
            font-weight: 900;
            line-height: 1;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 10px 20px rgba(0,0,0,.24);
            touch-action: manipulation;
            user-select: none;
        }

        .touch-controls .up { grid-column: 2; }
        .touch-controls .left { grid-column: 1; grid-row: 2; }
        .touch-controls .down { grid-column: 2; grid-row: 2; }
        .touch-controls .right { grid-column: 3; grid-row: 2; }

        @media (max-width: 700px), (pointer: coarse) {
            body {
                justify-content: flex-start;
                gap: 0;
            }
            #game-container {
                width: min(400px, calc(100vw - 28px), calc(100dvh - 260px));
            }
            .touch-controls { display: grid; }
            .instructions { font-size: 0.82rem; }
        }

        @media (max-height: 660px) {
            #game-container {
                width: min(360px, calc(100vw - 28px), calc(100dvh - 230px));
            }
            .touch-controls {
                grid-template-columns: repeat(3, clamp(60px, 15vw, 70px));
                grid-template-rows: repeat(2, clamp(56px, 13vw, 64px));
                gap: clamp(12px, 3vw, 16px);
                margin-top: 12px;
            }
            h1 { margin-top: 32px; }
        }

        @media (max-width: 360px) {
            .touch-controls {
                grid-template-columns: repeat(3, minmax(56px, 1fr));
                grid-template-rows: repeat(2, 56px);
                width: min(248px, calc(100vw - 28px));
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <a class="home-btn" href="../index.html">Home</a>

    <h1>Snake Game</h1>

    <div class="score-container">
        <div class="score-box">Score: <span id="current-score">0</span></div>
        <div class="score-box">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlay-text">Ready for the challenge?</h2>
            <button id="start-btn" class="btn">Start Game</button>
            <p class="instructions">Use the arrow keys or the touch controls.<br>Do not hit the walls or yourself.</p>
        </div>
    </div>

    <div class="touch-controls" aria-label="Touch controls">
        <button class="up" data-dir="up" aria-label="Up">^</button>
        <button class="left" data-dir="left" aria-label="Left">&lt;</button>
        <button class="down" data-dir="down" aria-label="Down">v</button>
        <button class="right" data-dir="right" aria-label="Right">&gt;</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("current-score");
        const highScoreEl = document.getElementById("high-score");
        const overlay = document.getElementById("overlay");
        const overlayText = document.getElementById("overlay-text");
        const startBtn = document.getElementById("start-btn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let isGameOver = true;
        let lastUpdateTime = 0;
        let gameSpeed = 100;
        let changingDirection = false;
        let touchStart = null;

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 5 },
                { x: gridSize * 4, y: gridSize * 5 },
                { x: gridSize * 3, y: gridSize * 5 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            generateFood();
            isGameOver = false;
            changingDirection = false;
            overlay.classList.add("hidden");
            lastUpdateTime = 0;
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (isGameOver) return;
            requestAnimationFrame(gameLoop);
            const elapsed = timestamp - lastUpdateTime;
            if (elapsed < gameSpeed) return;
            lastUpdateTime = timestamp;
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            checkGameOver();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00f2fe" : "#4facfe";
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.shadowColor = "#00f2fe";
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                generateFood();
                if (gameSpeed > 50) gameSpeed -= 2;
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            if (snake.some(part => part.x === food.x && part.y === food.y)) generateFood();
        }

        function drawFood() {
            ctx.fillStyle = "#ff4757";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff4757";
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function checkGameOver() {
            const head = snake[0];
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= canvas.width;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= canvas.height;
            let hitSelf = false;

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    hitSelf = true;
                    break;
                }
            }

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall || hitSelf) {
                isGameOver = true;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    highScoreEl.textContent = highScore;
                }
                overlayText.textContent = "You lost!";
                startBtn.textContent = "Try Again";
                gameSpeed = 100;
                overlay.classList.remove("hidden");
            }
        }

        function setDirection(direction) {
            if (changingDirection) return;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (direction === "left" && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (direction === "up" && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if (direction === "right" && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (direction === "down" && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }

        window.addEventListener("keydown", e => {
            const directions = {
                ArrowLeft: "left",
                ArrowUp: "up",
                ArrowRight: "right",
                ArrowDown: "down"
            };
            if (directions[e.key]) {
                e.preventDefault();
                setDirection(directions[e.key]);
            }
        });

        document.querySelectorAll(".touch-controls button").forEach(button => {
            button.addEventListener("pointerdown", e => {
                e.preventDefault();
                setDirection(button.dataset.dir);
            });
        });

        canvas.addEventListener("pointerdown", e => {
            touchStart = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener("pointerup", e => {
            if (!touchStart) return;
            const deltaX = e.clientX - touchStart.x;
            const deltaY = e.clientY - touchStart.y;
            if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) > 24) {
                setDirection(Math.abs(deltaX) > Math.abs(deltaY) ? (deltaX > 0 ? "right" : "left") : (deltaY > 0 ? "down" : "up"));
            }
            touchStart = null;
        });

        startBtn.addEventListener("click", initGame);
    </script>
</body>
</html>
